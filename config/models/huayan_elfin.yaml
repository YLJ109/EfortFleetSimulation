# ---------------------------------------------------------------------
# 限位口径冲突：这条必须留字，免得后人以为数据抄错了
#   · 机械说明书第 5 章「关节范围」写的是 ±360°（对所有轴）；
#   · 官方 xacro 的 <limit> 是 J1/J4/J6 ±180°、J2 ±134.6°、J3 ±149.5°、J5 ±146.7°。
# 处理：3D 显示与 clamp 一律采用 xacro 那套（厂商自己拿它做仿真和碰撞检查，更可信）；
#       说明书的 ±360° 理解为「J1/J4/J6 可连续旋转」的笼统写法。
#       只读阶段两种口径都不会让机器人动，冲突不影响安全，但**别拿来当运动学的许可范围**。
# ---------------------------------------------------------------------
limit_source_note: "见上；显示用 xacro limits，不用说明书 ±360"

# ---------------------------------------------------------------------
# 界面显示量程（deg）—— 由上面的弧度限位换算而来，供 HUD 画刻度
# ---------------------------------------------------------------------
joint_limits_display:
  - { name: "J1", min: -180.0, max: 180.0 }
  - { name: "J2", min: -134.6, max: 134.6 }
  - { name: "J3", min: -149.6, max: 149.6 }
  - { name: "J4", min: -180.0, max: 180.0 }
  - { name: "J5", min: -146.7, max: 146.7 }
  - { name: "J6", min: -180.0, max: 180.0 }

# ---------------------------------------------------------------------
# 3D 网格：官方仓库按连杆给了 STL（model/ethercat/elfin5/elfin_link1..6.STL + base + end）
# 与埃夫特那条 STEP→GLB 流程同构，等机型确认后一次性转成 GLB；
# 12 台共用一份几何（见 docs 里 fleet 方案的 clone() 一节），所以网格只搬一次。
# ★ 没转出来之前，前端对华沿用「关节链 + 圆角胶囊体」的骨架画法，
#   尺寸直接取上面的 joints —— 宁可简陋，也不要一个来路不明的模型。
# ---------------------------------------------------------------------
mesh:
  source_dir: "vendor/elfin_model/model/ethercat"
  glb: ""                  # 空 = 用 STL 原件；两条都没有时退回关节链骨架渲染
  # 官方 STL 直接进前端静态目录（1:1 原件，**没有**经过任何转换步骤）。
  # 为什么不转 GLB：本机没有网格转换工具，手写转换等于在厂商几何和屏幕之间
  # 插一个没人复核过的环节；STLLoader 吃原件，1:1 是可证明的。
  dir: "models/elfin5"
  files:
    base: "elfin_base.STL"
    links: ["elfin_link1.STL", "elfin_link2.STL", "elfin_link3.STL",
            "elfin_link4.STL", "elfin_link5.STL", "elfin_link6.STL"]
  fallback: "joint_chain"

# ---------------------------------------------------------------------
# 上机后必做的自校验（这是唯一能证明「机型选对了、关节方向没反」的办法）：
#   本地 FK(6 个关节角) 算出的 TCP，对比 DataSheet 里控制器自己给的
#   PosAndVel.Actual_PCS_Base（单位 mm，姿态为度）。
#   §5.2 字段释义（原文）：Actual_PCS_Base = 基于**基座坐标系**下的笛卡尔坐标位置；
#   Actual_PCS_TCP = 当前**工具坐标系**下的 —— 自校验要比的是基座系那一路，
#   与 fleet.yaml 的 cartesian_path 保持同一个字段，别一边 Base 一边 TCP。
#   两者一致 → 机型与关节链正确；不一致 → 要么 variant 选错，要么某轴符号相反。
#   校验期间机器人保持静止，不下发任何指令。
# ---------------------------------------------------------------------
self_check:
  enabled: true
  against_path: "PosAndVel.Actual_PCS_Base"
  position_tolerance_mm: 5.0
  # PCS_Base 的姿态字段口径（XYZ + Rx/Ry/Rz 度）—— 首台联调时确认欧拉序，
  # 若对不上先试 ZYX / XYZ 两种展开，别改机器人参数。
  orientation_convention: "unknown_until_first_connection"

