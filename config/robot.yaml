# =====================================================================
# EFORT ER8-700H 机器人配置（纯数据，换机型只改此文件）
# 单位: 长度 mm, 角度 deg, 寄存器为 Modbus 保持寄存器地址(0-based)
# DH 约定(标准): T_i = Rz(theta_i) * Tz(d_i) * Tx(a_i) * Rx(alpha_i)
#               其中 theta_i = q_i(关节角,度) + theta_offset_i
# =====================================================================

robot:
  model: "ER8-700H"
  serial: "OSN201BE16081"
  payload_kg: 8
  reach_mm: 712
  notes: "EFORT 6 轴垂直多关节, 控制器 Robox 系; H=桌面安装构型"

# ---- Modbus TCP 连接 ----
connection:
  host: "192.168.1.12"
  port: 502
  unit_id: 1
  timeout_s: 2.0
  # 机器人离线/未接网线时自动回退到模拟器(平滑合成轨迹), 也可强制开启:
  simulate: "auto"        # auto | always | never

# ---- 寄存器映射(实测反推, 控制器 192.168.1.12) ----
# 每个关节占用 2 个保持寄存器(float32, 大端, 字序交换: 高字在后)
modbus:
  func: 3
  base_addr: 10
  count: 12
  unit: "deg"
  word_order: "swap"      # float = struct.unpack('>f', pack('>HH', high, low))

# ---- 轴符号校准 ----
# 若某轴在界面上的旋转方向与真机相反, 把对应位改成 -1
# (同步作用于 TCP 计算 / 历史入库 / WebSocket 推送, 全链路一致)
axis_sign: [1, 1, 1, 1, 1, 1]

# ---- 关节行程限位(官方规格, 单位 deg) ----
# 供模拟界面的键盘控制做 clamp, 以及界面显示量程。
joint_limits:
  - { name: "J1", min: -170, max: 170 }
  - { name: "J2", min: -170, max: 90 }
  - { name: "J3", min: -85,  max: 150 }
  - { name: "J4", min: -180, max: 180 }
  - { name: "J5", min: -115, max: 115 }
  - { name: "J6", min: -360, max: 360 }

# ---- DH 参数(正运动学) ----
# status: measured = 来自装箱标定表/手册(可信); estimate = 待手册校准
# 零位约定(与真机示教器一致): J1=0 朝正前, J2=0 大臂垂直向上, J3=0 小臂水平向前,
#                             J4/J5/J6=0 法兰沿小臂方向水平向前。
dh:
  calibration_pending: true
  joints:
    - name: "J1"
      d: 376.0        # 基座到 J2 轴高(官方运动范围图)
      a: 49.5932      # 肩部偏距(实测, 可信)
      alpha: 90.0     # (标准构型)
      theta_offset: 0.0
      status: "measured"
    - name: "J2"
      d: 0.2852       # (实测, 近似 0)
      a: 330.1834     # 大臂长(实测, 可信)
      alpha: 0.0      # (标准构型)
      theta_offset: 90.0   # 机械零位: q2=0 时大臂垂直向上(由 J2 行程 +90/-170 唯一确定)
      status: "measured"
    - name: "J3"
      d: 0.0
      a: 40.2714      # 肘部偏距(实测, 可信)
      alpha: 90.0     # (标准构型)
      theta_offset: 0.0    # q3=0 时小臂水平向前(由 J3 行程 +150/-85 唯一确定)
      status: "measured_a"
    - name: "J4"
      d: 329.2414     # 小臂长(实测, 可信)
      a: 0.0
      alpha: -90.0    # (估算, 待校准)
      theta_offset: 0.0
      status: "measured_d"
    - name: "J5"
      d: 0.0
      a: 0.0
      alpha: 90.0     # (估算, 待校准)
      theta_offset: 0.0
      status: "estimate"
    - name: "J6"
      d: 80.0         # 腕长(估算, 待手册)
      a: 0.0
      alpha: 0.0
      theta_offset: 0.0
      status: "estimate"

# ---- 安装方式(影响底座变换) ----
mounting:
  type: "floor"      # floor | wall | ceiling  (H = 桌面/地装)

# ---- 服务端独立安全评估(方案 A1/A2/A3) ----
# 围栏几何与报警阈值在 config/safety.json(与前端出厂同源); 这里只放**机器人本体包络**。
# ★ 包络是"胶囊体(线段+半径)"的保守外扩, 宁可偏大不可偏小。
# ★ links_calibrated=false 表示半径是**默认近似值、未经现场卡尺复核** ——
#   此时 server_guard 即使写成 enforce 也会被**自动降级为 shadow**(不拿猜出来的半径去拒动作)。
safety:
  server_guard: "shadow"      # off | shadow(只记录不拦截) | enforce(参与互锁)
  # ★ "标定"的含义 = r_mm 不是猜的, 而是**官方数模反解**出来的(见下方 links 注释)。
  #   换机型 / 换数模 / 加末端工具后必须重跑一遍(命令就在 links 注释里), 否则改回 false。
  links_calibrated: true
  platform_height_mm: 180.0   # 立足面(站台台面)高度; 必须与前端 three/cell.js PLATFORM_H 同一个数
  # ---- 连杆包络（胶囊 = 两个 DH 帧原点连成的线段 + 半径）----
  # ★★ 这六个数是**算出来的，不是猜的**：
  #   ① `cd frontend && node tools/dump_mesh_lowpoints.mjs`
  #      → 用官方 GLB(public/models/robot_full.glb) 逐顶点量 503 个采样姿态下每根刚体的真实包围盒
  #   ② `cd backend && python tools/fit_safety_links.py`
  #      → 反解"每个姿态都把刚体包住"所需的最小半径(上取整到 5mm)
  #   ③ 钉在 `tests/test_safety_envelope.py`：任何姿态下**服务端包络最低点 ≤ 数模最低点**、
  #      水平外接 ≥ 数模外接（= 永远比真实本体更早报警），并把半径改小一条就会红。
  #   为什么必须这样：原先手写的 130/115/95/75/62/50 在零位算出最低点 **261mm**，
  #   数模真实值是 **191.5mm** —— 猜的包络比本体**更高**，等于把"快贴台面"说成"还早"（假安全）。
  links:                      # link i = DH 第 i 坐标系原点 → 第 i+1 个原点(frames[0]=base, frames[6]=法兰)
    - { from_frame: 0, to_frame: 1, r_mm: 225.0 }   # 底座(实测外廓 220) + 转座水平外廓；不参与地面净空
    - { from_frame: 1, to_frame: 2, r_mm: 185.0 }   # 大臂 + **转座的地面覆盖**(零位 191.5mm 就靠这段压住)
    - { from_frame: 2, to_frame: 3, r_mm: 130.0 }   # 肘部
    - { from_frame: 3, to_frame: 4, r_mm: 105.0 }   # 小臂
    - { from_frame: 4, to_frame: 5, r_mm: 95.0 }    # 腕
    - { from_frame: 5, to_frame: 6, r_mm: 55.0 }    # 法兰前(不含末端工具, 装夹爪后需重标定)
  stop_time_s: null           # A3 SSM 的 T: 该速度档下从指令到完全停止的时间, **必须现场实测**; null = 未知 → 不给建议
  ssm_k100_mm_s: null         # A3 SSM 的 K100: 100% 速度时的接近线速度(mm/s), **必须现场实测**(抄"典型值"= 编安全距离)
  ssm_c_mm: null              # A3 SSM 的 C: 停机过冲 + 工具/工件形状裕量; null = 未知 → 不给建议

# ---- 事件取证包(方案 A5) ----
# ★★ 落盘位置 = {logs_dir()}/evidence/<UTC时间>-<seq>/ —— **必须**跟着 EFORT_LOGS_DIR 走
#   (测试隔离三样之一), 所以现场排障看生产日志时, 取证包就在同一个目录树里。
# ★ seq 只增不减(计数在 evidence/.seq); 列表刷新水位用 seq, 不用数组长度。
evidence:
  enabled: true               # false = 完全不落盘(取证关掉, 互锁不受影响)
  buffer_seconds: 10.0        # 环形缓冲窗口(实时样本); 按**时间**裁剪, 不按条数
  keep_days: 7                # 保留天数(方案边界: 不做永久保留)
  max_packs: 200              # 再少也不删当日: 超出部分按最旧先清

# ---- 采样与推送 ----
sampling:
  read_hz: 10.0          # Modbus 读取频率
  db_write_hz: 2.0       # 入库频率(防止库膨胀)
  ws_push_hz: 20.0       # WebSocket 推送频率
  history_retention_days: 30   # 历史自动清理保留天数

# ---- E2 到位自证（段级残差带 · ★只读观测件，不参与任何控制）----
# 为什么不是"轨迹跟踪精度": 执行者是控制器里的常驻程序 210，PC 只写"目标 + 触发位"，
# 拿不到速度曲线 → 无法逐拍算"此刻应该在哪"。能自证的只有**段级**收敛过程:
# 动没动(stuck) / 峰值残差与收敛耗时 / 到位后回弹(overshoot) / 超时无进展(not_reached)。
# 残差单位是**关节角差(°)**不是 mm；"带" = 到位容差 + 一拍采样延迟(read_hz 决定)的不确定度。
# ★ 超差只发**一条 warn 事件**并在界面提示 —— 不自动暂停、不自动重试、不急停（刹车必须人点）。
twin_residual:
  enabled: true
  tol_deg: 1.0              # 到位容差(°)，与 C 位到位校验 3.0 同量级、更严一档
  start_timeout_ms: 1500    # 下发后这么久残差没下降 = stuck（没动起来）
  band_max_deg: 5.0         # 不确定带上限(°)：只由**本段**速率决定，不被上一段撑宽
  settle_hold_ms: 300       # 连续落在带内这么久才算"到位"（单拍落带不算）
  slow_ms: 8000             # 到位但耗时超过它 → 如实标 slow（不改成 arrived）
  overshoot_factor: 2.0     # 到位后又弹出 > 带×该系数且不再回来 = overshoot
  max_ms: 30000             # 单段最长观测窗口（对齐 rc_jog_execute 的 30s 上限）
  profile_max: 240          # 每段残差曲线最多留多少点（取证包会带出去）

# ---- E5′ 持件/吸空证据（固定相机反用法）----
# ★★ 只读观测件：把**送检本来就要抓的那几帧**再读一遍 → 三档证据
#   「有证据支持 / 仅流程推断 / 证据与流程矛盾」。现场**没有真空传感器**，
#   今天"手上有没有件"纯靠流程推断，这是 §7 明文的能力缺口。
#   **不新增拍摄、不新增移动**；矛盾只发一条 warn 事件并在界面提示，
#   **不会自动暂停、不会重试、不会急停**（刹车必须人点）。
hold_state:
  enabled: true
  history_max: 40           # 环形历史（每条 = 一轮送检的帧证据）
  area_ratio_max: 2.0       # 多帧块面积最大/最小 超过它 → 证据不足，退回"仅推断"

# ---- 数据库 ----
database:
  url: "sqlite:///data/robot.db"

# ---- 服务 ----
server:
  host: "0.0.0.0"
  port: 8000
  ws_path: "/ws/pose"

# ---- 运动下发(执行引擎写路径) ----
# 真实下发给控制器需双确认: 1) 环境变量 EFORT_REAL_MOTION=1  2) 此处 real_write: true
motion:
  # ★★★ 写路径已于 2026-09-23（Stage D）按实测寄存器表重写（services/modbus.py）：
  #   点动通道：逐寄存器 FC6 写 40139~44(0基址 138..143) 目标绝对角(×100 int16)
  #   → 回读校验 → 稳定 0.15s → 置 40135(134).Bit0 触发 → 等 40035(34).Bit0 完成 → 撤触发。
  #   控制器上必须有常驻点动服务程序（200/JOGSVC）在 WAIT 挂起 —— 界面「一键就绪」可自动做到。
  # 2026-09-23 用户授权真机联调，双闸已开；恢复安全模拟改回 false 并重启后端。
  real_write: true
  # ⚠ 以下三个旧地址已**实机证伪**，仅留档，代码不再读取：
  write_func: 16            # 已证伪(FC16 写多寄存器 —— 控制器用的是逐寄存器 FC6)
  write_base_addr: 30       # 已证伪(实测该区可读且恒 0，不是目标关节角区)
  write_speed_addr: 42      # 已证伪(目标速度走 40103 速度设定，不在这)
  # 围栏互锁严格模式：true 时，前端未实时上报围栏状态(或状态过期)就拒绝下发运动。
  # 默认 false —— 放行但记一条告警事件，避免纯脚本/后台调用被误锁。
  require_live_safety: false

  # ---- 控制器 Modbus 地址表（2026-09-23 实机确认，0 基址；手册写作 4xxxx = +1）----
  # 读：0 状态位 / 2 运行速度% / 3,4 报警码 / 5 当前程序号 / 10..21 J1..J6(FLOAT,CDAB)
  #     34 机器人→PC 用户位区(Bit0 = 点动完成回执 = 手册 40035)
  # 写：100 指令位(手册 40101) / 102 速度设定 / 103 目标程序号
  #     134 PC→机器人 用户位区(Bit0 = 点动触发 = 手册 40135)
  #     138..143 J1..J6 目标绝对角 ×100 的 int16(手册 40139~40144)
  # 命令字(同沿单条写、始终保留 Bit0+Bit12)：
  #     0x1001 伺服上电 / 0x1011 加载 / 0x1013 运行 / 0x1005 停止
  #     0x1009 清报警 / 0x2000 取消使能 / 0x0000 全清
  # 重吸合序列：0x0000 → 等 0.6s → 0x1001（吸合延迟实测 ≈0.55s）
  # 报警码：1812 安全门 / 5005 加载的程序不存在 / 4902 XPL 文件损坏
  # 硬规则：必须【自动】模式；先加载成功才准运行；加载前别发停止；清报警后再加载。
  channel_note: "详见 docs/控制器Modbus寄存器勘察报告.md"

  # ---- 点动(示教)参数：对齐示教器 T1 教学模式的限速与"三段使能开关"语义 ----
  jog:
    max_speed_dps: 30      # 关节角速度上限(°/s)。T1 教学限速, 超过会被引擎夹紧
    watchdog_ms: 1500      # 死人开关: 连续点动期间超过此时间未收到 keepalive 即自动停
    tick_ms: 100           # 点动下发周期(ms), 越小越顺滑但总线负载越高
    step_angles: [0.1, 1, 5, 10]   # 增量点动可选角度(°), 供前端档位显示
    # ★ 点动服务程序号：控制器上那个常驻点动程序（现场 = 200 / JOGSVC）。
    #   0 = 未指定（不要瞎猜号，猜错就是白报一次 5005）。
    #   ★ 点动**实际速度**由 40103 速度设定控制；但常驻服务程序本体带
    #     `v…perc` 速度常量（现场 200 = v50perc），按铁律 6：
    #       有效速度 = 程序内 v…perc × 40103
    #     即 40103=5% 时实际只走 2.5%。实测 40103=5% → ≈1.3°/s 是 v100perc 的特例
    #     （v100perc×40103=40103，看起来像"直接由 40103 控制"）。
    #   ★ 因此下发端会**反算** 40103 = UI速度 ÷ (v…perc/100)，使「右上角速度 = 实际速度」。
    #     例：右上角设 20% → 写 40103 = 20 ÷ 0.5 = 40% → 实际 0.5×40 = 20%。
    #   ★ 现场控制器上的三合一常驻服务程序（点动+吸气+停止吸气）编号 = **210**。
    #   ★★ 2026-09-29 定案：三件事全部写进**同一个 210**，不再拆分。
    #     200 是旧的纯点动程序（JOGSVC），保留为备用/回退，不在白名单主路径上。
    #     为什么必须合并到一个程序：控制器同一时刻只能加载并运行一个程序，
    #     拆号就要「停当前程序 → 加载另一个号 → 运行」来回切 —— 反复撞 5005
    #     （加载的程序不存在）+ 切换竞态；合并后 rc_vacuum_prepare(210) 幂等立即返回。
    #     历史教训：曾误写 2001 —— 控制器上没有该号，写进去就是一次 5005。
    service_program: 210
    # ★ 常驻服务程序内 `v…perc` 速度常量的数值（百分比，不带"perc"）。
    #   有效速度 = 程序内 v…perc × 40103（铁律 6）。
    #   ★★ 2026-09-29 定为 100（程序内写 v100perc）—— 这是"速度显示不一致"的根治点：
    #     用 v50perc 时，为让"右上角 = 实际速度"必须把 40103 写成本身的 2 倍
    #     （设 17% → 写 34%），于是**示教器显示 34%、右上角 17%**，现场报"速度突然飘升到 34%"。
    #     改成 100 后：有效速度 = 100% × 40103 = 40103 →
    #     **上位机写多少、示教器显示多少、机器人走多少，三者完全一致**，反算逻辑自动失效。
    #     ⚠ 必须与控制器 210 程序里的 v100perc 一致；改一边不改另一边会差一倍。
    service_program_vperc: 100

  # ---- 真空吸放（2026-09-29 新增）----
  vacuum:
    # 吸放服务所在程序号 —— 与点动**同一个 210**（见 motion.jog.service_program 注释）。
    #   40135.Bit1 = 吸气；Bit2 = 停止吸气。完成位 40035.Bit1 / Bit2。
    #   ★ 2026-09-29 按用户口径**取消 0.5s 脉冲自动停**：吸气改为电平保持(on)，
    #     必须由 Bit2 显式关断 —— 否则"吸 0.5s 就自动松手"，工件会脱落。
    service_program: 210

  # ---- 一键就绪：允许「加载并运行」的程序号白名单（2026-09-25 安全审查新增）----
  # 背景：原先 /api/ready 的 prog 参数无任何约束，持操作员令牌即可让控制器
  #       加载并**运行任意程序号**（仓库 programs/ 下就有 411.XPL）。
  # 缺省只放行点动服务程序；确需运行其它程序，在这里显式追加后重启后端。
  ready:
    # ★ 2026-09-29：210 = 三合一主路径；200 = 旧纯点动程序，留作回退。
    #   仍不放行 411 等产线/测试程序。
    allowed_programs: [200, 210]

  # ---- 轴锁策略（2026-09-29 用户口径再确认）----
  # 口径（务必别搞反）：
  #   · **操作员**在安全前提下 J1–J6 **全轴可控** —— 这是生产默认，锁默认关闭。
  #   · 「仅 J6」是**给 AI 做真机验证用的临时护栏**，不是给操作员设的限制。
  #     用户原话："我说的是**你**（AI）不能移动，不是我，我可以移动。"
  #   打开方式（二选一，重启后生效）：
  #      ① 此处改 true；② 环境变量 EFORT_J6_ONLY=1（AI 起后端做验证时用）
  #   ★ 2026-09-29 事故：把 enabled 误当成生产默认改成 true 并一直留着，
  #     结果操作员自己点动 J1 被拒（"轴锁模式已开启：J1 不可动"）—— 已改回 false。
  joint_lock:
    enabled: false            # ★ 生产默认 false = 操作员全轴可动（勿为 AI 验证长期打开）
    locked_joints: [1, 2, 3, 4, 5]   # 仅在模式开启时生效
    only_joint: 6                    # 仅在模式开启时唯一可动的轴
    tolerance_deg: 0.5               # 被锁轴允许的偏差容差（°）
    apply_in_sim: true               # 模式开启时仿真同限，避免"真机不能动、仿真能动"

# ---- 视觉颜色分拣 ----
# 算法跑在独立的相机服务(camera/camera_service.py, 默认 :8100)里, 后端只做
# "记录落库 + 事件广播 + 分拣规则联动", 不重复抓帧、不跨进程传图。
vision:
  base_url: "http://127.0.0.1:8100"   # 相机服务地址
  poll_ms: 800          # 后端拉取相机 /vision/last 的周期(ms), 用于把触发事件落库
                        # ★ 审计修复 P0-cam-2/2b: 游标只按 event.seq 推进（无事件不推进）；
                        #   两次轮询之间若发布了多条、被单槽 /vision/last 覆盖，
                        #   会用 /vision/records 把序号空洞补回来 —— 因此本值与检测
                        #   帧率错配也不会丢事件，不必为了"追快一点"而调小。
  timeout_s: 3.0        # 单次调用超时; 相机服务没起时快速失败, 不拖慢后端
  enabled: true         # 后端是否摄入相机事件(记录/事件/联动); 关掉只保留代理
  auto_execute: false   # 命中规则后是否自动下发程序。★ 默认为 false:
                        #   视觉误判+自动运动 = 现场事故, 必须显式开启并配合围栏互锁。
  retention_days: 30    # 视觉记录保留天数(启动时清理一次)
