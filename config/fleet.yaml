# ---------------------------------------------------------------------
# 推送节流：12 台不能各自发一帧 WebSocket，必须合批。
# 50ms 一次、每次带全部 12 台，前端一次渲染 —— 与采集的最慢档同频。
# ---------------------------------------------------------------------
streaming:
  batch_interval_ms: 50
  include_offline_status: true

# ---------------------------------------------------------------------
# 相邻臂干涉互锁：**故意不做**，只保留判据说明。
# 用项目自己的围栏尺寸算过：围栏 1.64m 见方，ER8-700H 臂展 0.712m，
# 贴放时两台可达圆之间还剩 1.64 - 0.712*2 = 0.216m 间隙，
# 单臂最远也只到自己的围栏边 0.82-0.712 = 0.108m 处。
# 也就是说：围栏本身已经把两臂隔开了，跨机互锁是多余的一层。
# 若日后把 cell_pitch_m 改小到 < 1.424m，本条结论作废，必须补互锁。
# ---------------------------------------------------------------------
interlock:
  enabled: false
  reason: "围栏 1.64m 间距 > 两臂半径之和 1.424m，几何上不可能互相触及"
  min_safe_pitch_m: 1.424
