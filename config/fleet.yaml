# =====================================================================
# 机房 12 台机器人登记表（fleet registry）
#
# 数据来源（都不是猜的）：
#   · 台数/品牌分区/摆放关系 —— 用户 2026-10-05 的平面图：
#       左侧 A 区、右侧 B 区；每区上半 3 台、下半 3 台；编号从下面开始。
#   · 同组内的间距 —— 用户口径「没有距离，贴着的，周围有安全围栏，
#       参考项目的安全围栏距离就行了」→ 取 config/safety.json 的围栏尺寸
#       half.x=half.z=0.82 → 单台围栏 1.64m 见方，贴着放 = 中心距 1.64m。
#   · 上下两组之间的间隔 —— 用户口径「竖着的中间有 1 米间隔」→ 1.0m 净空。
#   · 埃夫特通讯参数 —— config/robot.yaml + 已实测的 Modbus 寄存器表。
#   · 华沿通讯参数 —— 《HuayanRobotV6控制通信协议接口_V1.0.19.1》§3.2 端口表
#       + §5.1/5.2 DataSheet 帧格式（不是 Modbus，见 huayan 段注释）。
#
# ★ 本轮（阶段一）只读：driving 一律 false，write_allowed 一律 false。
#   真机运动的闸门见 backend §8.2「双闸」，本文件不是其中一闸，也不打算提前打开。
# =====================================================================

fleet:
  # ★ 仿真总闸：12 台全部换成合成帧，不建任何 TCP 连接，卡片会挂「仿真」标。
  #   本机没接机器人时靠它让大屏有 20Hz 数据可看。
  #   ★ 出厂默认 false，和 enabled 一样：调试/CI 不该被 12 条线程打扰，
  #     而且"默认就有数据"会让人误以为链路真的通了。
  #     本机要开：环境变量 EFORT_FLEET=1 + EFORT_FLEET_SIM=1（见 scripts/start_backend.bat）。
  #   ★ 它只换数据源，不开任何写通道：driving / write_allowed 依旧是 false。
  simulate: false
  # ★ 现场部署改成 true（或设环境变量 EFORT_FLEET=1）。
  #   默认 false 不是"功能没做完"，而是：单机调试 / 测试 / CI 都不该被 12 条
  #   采集线程打扰，而且机房地图一旦启用就是操作员看到的实况。
  enabled: false
  schema_version: 1

# ---------------------------------------------------------------------
# 布局模板：4 组 × 3 台。改间距只改这一段，不要逐台写坐标。
# 坐标含义：机器人基座中心，单位 m，地面坐标。
#   x = 区偏移（A 负 / B 正）
#   y = 沿纵深方向，组内 slot 递增方向
# ---------------------------------------------------------------------
layout:
  # 单台安全围栏见方边长（safety.json: half 0.82 → 1.64）
  cell_pitch_m: 1.64
  # 上下两组之间的净空（不含围栏本身）
  group_gap_m: 1.00
  # A/B 两区围栏外缘之间的净空。用户没给，取与组间净空同值 1.0m，
  # 使总宽 = 1.0 + 1.64*2 = 4.28m；需要更宽的通道只改这一个数。
  zone_gap_m: 1.00
  # 每组的台数（图中「3 个竖着贴着」）
  group_size: 3
  # 组的排布：组内沿 +y，组间沿 +y；A 区在 -x，B 区在 +x
  group_axis: "y"
  zone_axis: "x"
  # 整块阵列绕原点居中（让机房视觉中心落在场景原点，不偏一半）
  center_array: true
  # 机器人安装朝向：基座 +x 方向（埃夫特/华沿都是围栏开口朝通道）
  yaw_deg: 0.0

# ---------------------------------------------------------------------
# 型号档案（每台只写 model 引用，参数别处不重复）
# ---------------------------------------------------------------------
models:
  efort_er8_700h:
    display_name: "埃夫特 ER8-700H"
    brand: "EFORT"
    driver: "efort_modbus"
    config_file: "config/robot.yaml"   # DH / 限位 / 寄存器表都在这，单一真源
    axes: 6

  huayan_elfin:
    display_name: "华沿 ELFIN 协作臂"
    brand: "HUAYAN"
    driver: "huayan_datasheet"
    config_file: "config/models/huayan_elfin.yaml"
    axes: 6

# ---------------------------------------------------------------------
# 驱动参数
# ---------------------------------------------------------------------
drivers:
  # ---- 埃夫特：Robox 控制器 Modbus TCP，已实测反推 ----
  efort_modbus:
    host: "192.168.1.12"     # 单台时期的实测地址，见下 TODO
    port: 502
    unit_id: 1
    timeout_s: 2.0
    read:
      func: 3
      base_addr: 10          # J1..J6 = 12 个保持寄存器, float32 大端字序交换
      count: 12
      unit: "deg"
      word_order: "swap"
    poll_ms: 50              # 20Hz；连接失败时采集线程自己退避，不影响别人
    # TODO(未核): 6 台埃夫特的 IP 各不相同，本文件里 6 个 host 是占位规划值。
    #   上线前必须逐台 ping + scripts/port_scan.py 确认，错一台就会读到隔壁的数。

  # ---- 华沿：ELFIN 控制器主动推送，不是 Modbus ----
  # 《HuayanRobotV6控制通信协议接口》§3.2 服务端口表：
  #   10001 IF 快速命令端口 / 10003 IF 命令端口
  #   10004/10005/10006 JSON DataSheet 推送 @50/100/200ms
  #   10014/10015/10016 Struct DataSheet 推送 @50/100/200ms
  #   10502 ModbusTCP 服务端（只有 holding 0~99，装不下关节角，所以不用它）
  # 结论：连 10004 被动收包。控制器是服务端，客户端只管 connect，无需握手，
  #       50ms 一帧自己来 —— 12 台并发时比轮询省得多。
  huayan_datasheet:
    port: 10004
    timeout_s: 3.0
    # 帧头（§5.1）：Magicnumber 4B 固定 "LTBR"(0x4C 0x54 0x42 0x52)
    #             总长   4B = 本表所有字段长度之和
    #             净长度 4B = 净数据 JSON 字符串的字节数
    #             净数据 JSON
    magic: "LTBR"
    # ★ 未定项：全文（含 ROS2 驱动文档）都没有写这两个 4 字节整数的字节序 ——
    #   不是漏读，是文档确实没有。先按小端解；解不出时 split_ltbr 会返回带
    #   "header_byte_order" 的错误串，改成 big 即可，不用改代码。
    header_byte_order: "little"
    # 字段路径（§5.2 实例：Actual_Position 前 6 个是关节角°，后 6 个是笛卡尔）
    joints_path: "PosAndVel.Actual_Position[0:6]"
    # ★ 笛卡尔取哪一路，是照 §5.2 的字段释义定的，不是看哪个名字像：
    #     Actual_PCS_Base = 基于**基座坐标系**下的笛卡尔坐标   ← 3D 画面要的就是这个
    #     Actual_PCS_TCP  = 当前**工具坐标系**下的笛卡尔坐标
    #     Actual_Position[6:12] = 当前用户坐标+工具坐标下的笛卡尔
    #   文档示例里三者数值相同（默认工具/用户坐标系是单位变换），所以现场不容易发现取错；
    #   一旦操作员示教了一个带偏移的工具 TCP，取 TCP 那一路就会让 3D 上的法兰凭空挪走。
    cartesian_path: "PosAndVel.Actual_PCS_Base"
    joint_velocity_path: "PosAndVel.Actual_Joint_Velocity"
    enabled_path: "StateAndError.robotEnabled"      # 0 未使能 / 1 使能
    moving_path: "StateAndError.robotMoving"        # 0 静止 / 1 运动中
    inpos_path: "StateAndError.InPos"
    error_code_path: "StateAndError.Error_Code"
    error_axis_path: "StateAndError.Error_AxisID"
    override_path: "PosAndVel.Actual_Override"      # 速度比 0~1
    stamp_path: "MsgTitle.Stamp"                    # 毫秒绝对时间戳
    # ★ 写通道（10003 IF 命令服务端口）—— 出厂默认 **false**。
    #   这一行是真机运动的总开关：关掉时 /api/fleet/{id}/move 对真机一律 501，
    #   一个字节都不会发给控制器；打开前必须现场验证急停、使能、限位行为（真机红线）。
    #   命令语法逐条抄自《HuayanRobotV6控制通信协议接口_V1.0.19.1》
    #   §2.1/§2.2（ASCII、逗号分隔、",;" 结尾）、§4.2.1~4.2.4（GrpEnable/Disable/Reset/Stop）、
    #   §4.5.1（SetOverride，dOverride 是 0.01~1 的速度比，运动状态不可改）、
    #   §4.10.5（WayPoint 24 参数；关节运动用 nMoveType=0 + nIsUseJoint=1）。
    command_write:
      enabled: false
      port: 10003
      timeout_s: 2.0
      rbt_id: 0                # nRbtID，文档有效范围 0~5，默认 0
      # 下面三个数取自 §4.10.5.2 的官方示例（"关节运动-使用关节点位"那条）：
      # 关节运动 dVelocity 单位 °/s、dAcc 单位 °/s²、dRadius 单位 mm。
      velocity_dps: 50.0
      acc_dps2: 360.0
      cmd_id_prefix: "F"       # strCmdID 前缀（协议要求 ASCII，禁 , ; 与控制字符）
    # 断流兜底：10003 命令端口主动问一次（只读命令，不动机器人）
    fallback_command:
      port: 10003
      request: "ReadActCoord,0,,,;"
      # 成功返回 ReadActCoord,OK,dJ1..dJ6,dX,dY,dZ,dRx,dRy,dRz,
      reply_prefix: "ReadActCoord,OK,"
      joints_from: 2
      joints_to: 8

# ---------------------------------------------------------------------
# 12 台登记。编号（order）规则：从下面开始 —— 每组 slot 1 靠下（y 小的一侧）。
# 分区归属：A 区(左)=6 台埃夫特，B 区(右)=6 台华沿。
#   ★ 这是按「左侧…右侧…分别 6 台」的字面对读法定的；若现场是反的，
#     只需对调下面 12 行的 zone，坐标会自动跟着换。
# ---------------------------------------------------------------------
